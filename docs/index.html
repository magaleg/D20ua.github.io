<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Довідник | Головна</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Основні налаштування */
        body {
            margin: 0;
            background-color: #1a1a1a; /* Темний фон для всього сайту */
            color: #cfa55d;
        }

        /* Перший екран */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh; /* Повний екран */
            padding-top: 20px;
            box-sizing: border-box;
        }

        .title-container {
            text-align: center;
            margin-top: 5%;
            margin-bottom: 20px;
        }


        .carousel-container {
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        .category-card-display {
            width: 100%;
            max-width: 600px;
            min-height: 400px;
            background-image: url('assets/img/mainboxbg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            text-decoration: none;
            padding: 20px 40px;
            text-align: center;
            transition: 0.5s;
            box-sizing: border-box;
        }

        .category-image {
            max-width: 80%;
            max-height: 250px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .category-title {
            font-size: 2.2em;
            margin: 5px 0;
            color: #cfa55d;
            font-variant: small-caps;
        }

        .category-description {
            font-size: 1em;
            color: #cfa55d;
            font-style: italic;
        }

        /* Другий екран - Панель кнопок */
        .navigation-panel {
            border: 2px solid #cfa55d;
            min-height: 100vh;
            padding: 50px 20px;
            background: linear-gradient(to bottom, #1a1a1a, #2c1a1a);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        

        .menu-button {
            background: #332211;
            border: 2px solid #cfa55d;
            color: #cfa55d;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
        }

        .menu-button:hover {
            background: #cfa55d;
            color: #1a1a1a;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(207, 165, 93, 0.4);
        }

        /* Стрілки */
        .arrow { width: 0; height: 0; cursor: pointer; transition: 0.3s; }
        .arrow-left { border-top: 40px solid transparent; border-bottom: 40px solid transparent; border-right: 50px solid #cfa55d; }
        .arrow-right { border-top: 40px solid transparent; border-bottom: 40px solid transparent; border-left: 50px solid #cfa55d; }

        .fade { animation: fadeIn 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0.2; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 650px) {
            .menu-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <!-- ПЕРШИЙ ЕКРАН -->
    <section class="hero-section">
        <div class="title-container">
            <h1>ОБЕРИ СВОЮ ДОЛЮ</h1>
        </div>
        <div class="carousel-container">
            <div class="arrow arrow-left" onclick="prevSlide()"></div>

            <a href="#" id="category-link" class="category-card-display fade">
                <img src="" id="category-img" class="category-image" alt="Class Image">
                <h2 id="category-name" class="category-title"></h2>
                <p id="category-desc" class="category-description"></p>
            </a>

            <div class="arrow arrow-right" onclick="nextSlide()"></div>
        </div>
        <!-- Підказка про скрол -->
        <div style="margin-top: auto; padding-bottom: 20px; font-size: 0.9em; opacity: 0.7;">
            ▼ Гортай вниз, щоб побачити більше ▼
        </div>
    </section>

    <!-- ДРУГИЙ ЕКРАН -->
    <section class="navigation-panel">
        <h2>ШВИДКИЙ ДОСТУП</h2>
        <div class="menu-grid">
            
            <a href="wiki/races.html" class="menu-button">Раси</a>
            <a href="wiki/classes.html" class="menu-button">Класи</a>
            <a href="wiki/traits.html" class="menu-button">Риси</a>
            <a href="wiki/backgrounds.html" class="menu-button">Предісторії</a>
            <a href="wiki/spells.html" class="menu-button">Закляття</a>
            <a href="wiki/weapons.html" class="menu-button">Зброя</a>
            <a href="wiki/armor.html" class="menu-button">Обладунки</a>
            <a href="wiki/gear.html" class="menu-button">Спорядження</a>
            <a href="wiki/magic-items.html" class="menu-button">Магічні предмети</a>
            <a href="wiki/bestiary.html" class="menu-button">Бестіарій</a>
            <a href="sheets/character.html" class="menu-button" style="grid-column: span 1">Аркуш персонажа</a>
        </div>
    </section>

    <script>
        const categories = [
            { name: "Бард", desc: "Харизматичний чарівник-артист, загроза для драконів.", img: "assets/img/bard.png", url: "wiki/classes/bard.html" },
            { name: "Воїн", desc: "У тебе був безмежний вибір, але ти обрав людину-воїна.", img: "assets/img/fighter.png", url: "wiki/classes/fighter.html" },
            { name: "Варвар", desc: "Дикий воїн, що впадає в лють. Rawr.", img: "assets/img/barbarian.png", url: "wiki/classes/barbarian.html" },
            { name: "Друїд", desc: "Захисник природи, що перетворюється на звірів.", img: "assets/img/druid.png", url: "wiki/classes/druid.html" },
            { name: "Жрець", desc: "Служитель божества, що отримує сили від бога.", img: "assets/img/cleric.png", url: "wiki/classes/cleric.html" },
            { name: "Монах", desc: "Майстер бойових мистецтв, 1000 бонусних атак за хід.", img: "assets/img/monk.png", url: "wiki/classes/monk.html" },
            { name: "Паладин", desc: "Святий воїн, що дає священну клятву.", img: "assets/img/paladin.png", url: "wiki/classes/paladin.html" },
            { name: "Слідопит", desc: "Мисливець та провідник дикої місцевості.", img: "assets/img/ranger.png", url: "wiki/classes/ranger.html" },
            { name: "Пройдисвіт", desc: "Майстер скритності, хитрощів та ударів у спину.", img: "assets/img/rogue.png", url: "wiki/classes/rogue.html" },
            { name: "Чаклун", desc: "Той, хто уклав угоду з могутньою сутністю.", img: "assets/img/warlock.png", url: "wiki/classes/warlock.html" },
            { name: "Чарівник", desc: "Маг-задрот, що бачить магію як науку.", img: "assets/img/wizard.png", url: "wiki/classes/wizard.html" },
            { name: "Чародій", desc: "Отримує сили від народження. Чітер.", img: "assets/img/sorcerer.png", url: "wiki/classes/sorcerer.html"}
        ];

        let currentIndex = 0;

        function updateCarousel() {
            const card = document.getElementById('category-link');
            const name = document.getElementById('category-name');
            const desc = document.getElementById('category-desc');
            const img = document.getElementById('category-img');
            
            card.classList.remove('fade');
            void card.offsetWidth;
            card.classList.add('fade');

            const cat = categories[currentIndex];
            name.innerText = cat.name;
            desc.innerText = cat.desc;
            img.src = cat.img;
            card.href = cat.url;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % categories.length;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + categories.length) % categories.length;
            updateCarousel();
        }

        updateCarousel();

        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextSlide();
            if (e.key === "ArrowLeft") prevSlide();
        });
    </script>
</body>
</html>
